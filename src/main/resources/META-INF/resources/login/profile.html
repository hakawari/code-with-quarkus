<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>내 프로필</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

<div class="container py-5" style="max-width: 500px;">
    <h2 class="text-center mb-4">👤 내 프로필</h2>

    <!-- 프로필 이미지 -->
    <div class="text-center mb-4">
        <img id="profileImg"
             src="../uploads/profile/default.png"
             width="120" height="120"
             class="rounded-circle border border-secondary"
             style="object-fit:cover;">
    </div>

    <!-- 정보 테이블 -->
    <table class="table table-dark table-bordered">
        <tr><th>아이디</th><td id="username"></td></tr>
        <tr><th>이메일</th><td id="email"></td></tr>
        <tr><th>연락처</th><td id="phone"></td></tr>
    </table>

    <!-- 업로드 에러 메시지 -->
    <div id="uploadErrorMsg" class="alert alert-danger d-none mb-3"></div>

    <!-- 사진 업로드 폼 -->
    <form action="/profile/upload" method="post" enctype="multipart/form-data" class="mt-4">
        <label class="form-label">프로필 사진 변경</label>
        <input type="file"
               class="form-control mb-1"
               id="profileFile"
               name="profileImage"
               accept="image/jpeg,image/png,image/gif,image/webp">
        <div class="form-text text-muted mb-3">jpg, png, gif, webp / 최대 5MB</div>
        <button type="submit" class="btn btn-primary w-100">사진 업로드</button>
    </form>

    <hr class="my-4">

    <!-- 개인정보 수정 토글 버튼 -->
    <button class="btn btn-warning w-100 mb-2"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#updateFormArea"
            aria-expanded="false">
        개인정보 수정
    </button>

    <!-- 개인정보 수정 폼 (기본 숨김) -->
    <div class="collapse" id="updateFormArea">
        <div class="card card-body bg-dark text-white border-secondary mt-2">

            <!-- 수정 결과 메시지 -->
            <div id="updateMsg" class="alert d-none mb-3"></div>

            <form id="updateForm" method="POST" action="/profile/update">
                <!-- 이메일 입력 -->
                <div class="mb-3 text-start">
                    <label class="form-label">이메일</label>
                    <input type="text" class="form-control"
                           id="updateEmail" name="email"
                           placeholder="example@email.com">
                    <div class="invalid-feedback" id="updateEmailMsg"></div>
                </div>

                <!-- 연락처 입력 -->
                <div class="mb-3 text-start">
                    <label class="form-label">연락처</label>
                    <input type="text" class="form-control"
                           id="updatePhone" name="phone"
                           placeholder="010-0000-0000">
                    <div class="invalid-feedback" id="updatePhoneMsg"></div>
                </div>

                <button type="button"
                        class="btn btn-warning w-100"
                        onclick="validateAndUpdate()">
                    수정 완료
                </button>
            </form>
        </div>
    </div>

    <hr class="my-4">

    <!-- 비밀번호 변경 폼 -->
    <h5 class="fw-bold mb-3">🔒 비밀번호 변경</h5>

    <!-- 결과 메시지 -->
    <div id="pwMsg" class="alert d-none mb-3"></div>

    <form id="pwForm" method="POST" action="/profile/password">

        <!-- 현재 비밀번호 입력 -->
        <div class="mb-3 text-start">
            <label class="form-label">현재 비밀번호</label>
            <!-- 입력용 (서버 전송 안 됨) -->
            <input type="password" class="form-control"
                   id="currentPwInput"
                   placeholder="현재 비밀번호 입력" required>
            <div class="invalid-feedback" id="currentPwMsg"></div>
            <!-- 해시값 전송용 hidden -->
            <input type="hidden" id="currentPassword" name="currentPassword">
        </div>

        <!-- 새 비밀번호 입력 -->
        <div class="mb-3 text-start">
            <label class="form-label">새 비밀번호</label>
            <input type="password" class="form-control"
                   id="newPwInput"
                   placeholder="8자 이상, 영문+숫자+특수문자" required>
            <div class="invalid-feedback" id="newPwMsg"></div>
            <input type="hidden" id="newPassword" name="newPassword">
        </div>

        <!-- 새 비밀번호 확인 -->
        <div class="mb-3 text-start">
            <label class="form-label">새 비밀번호 확인</label>
            <input type="password" class="form-control"
                   id="newPwConfirm"
                   placeholder="새 비밀번호 재입력" required>
            <div class="invalid-feedback" id="newPwConfirmMsg"></div>
        </div>

        <button type="button"
                class="btn btn-danger w-100"
                onclick="validateAndChangePassword()">
            비밀번호 변경
        </button>
    </form>

    <div class="text-center mt-3">
        <a href="/" class="btn btn-outline-secondary">메인으로</a>
    </div>
</div>

<script>
    // 프로필 정보 불러오기
    fetch('/profile/info')
        .then(res => {
            if (res.status === 401) {
                window.location.href = '/login';
                return;
            }
            return res.json();
        })
        .then(data => {
            if (!data) return;
            document.getElementById('username').textContent = data.username;
            document.getElementById('email').textContent = data.email || '-';
            document.getElementById('phone').textContent = data.phone || '-';
            if (data.profileImage) {
                document.getElementById('profileImg').src = '/uploads/profile/' + data.profileImage;
            }
        });

    // 업로드 오류 메시지 처리
    const params = new URLSearchParams(window.location.search);
    const error = params.get('error');
    const msg = document.getElementById('uploadErrorMsg');

    if (error === 'invalid_type') {
        msg.classList.remove('d-none');
        msg.textContent = 'jpg, png, gif, webp 파일만 가능합니다.';
    } else if (error === 'too_large') {
        msg.classList.remove('d-none');
        msg.textContent = '파일 크기는 5MB 이하여야 합니다.';
    } else if (error === 'upload_failed') {
        msg.classList.remove('d-none');
        msg.textContent = '업로드 실패. 다시 시도해주세요.';
    }
</script>

<!-- Toast 컨테이너 -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999">
    <div id="liveToast" class="toast align-items-center text-white bg-success border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body" id="toastBody">메시지</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/test.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
