<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League of Legends - 로그인 페이지</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/test.js"></script>
    <script src="../js/test2.js"></script>
    <script src="../js/toggle.js"></script>

    <script>
        window.onload = function() {
            showToast('메인페이지로딩완료');
        }
    </script>

    <link rel="stylesheet" href="../css/main.css">
</head>
<body class="bg-dark text-white">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <img src="/image/lol logo.png" alt="" width="30" height="24">
            <button class="btn border-0 text-white" id="themeToggleBtn" onclick="toggleTheme()">
                DARK
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="#">뉴스</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">챔피언</a></li>
                    <li class="nav-item"><a class="nav-link" href="main_page_sub/download.html">다운로드</a></li>
                    <li class="nav-item"><a class="nav-link" href="/login">로그인</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            더보기
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="navbarDropdown">
                            <li><a class="dropdown-item" href="https://lol.ps/" target="_blank">전적검색</a></li>
                            <li><a class="dropdown-item" href="https://lolesports.com/ko-KR/" target="_blank">Esports</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="https://www.riotgames.com/ko" target="_blank">Riot Games</a></li>
                        </ul>
                    </li>
                </ul>
                <form class="d-flex" id="searchForm">
                    <input class="form-control me-2" type="search" placeholder="챔피언, 뉴스검색..." id="searchInput">
                    <button class="btn btn-outline-success" type="submit">검색하기</button>
                </form>
            </div>
        </div>
    </nav> 

    <section class="hero d-flex align-items-center justify-content-center text-center py-5" style="min-height: 70vh;">
        <div class="container" style="max-width: 400px;">
            <h2 class="fw-bold mb-4">로그인</h2>

            <form method="POST" action="/login_check" id="loginForm">
                
                <div class="mb-3 text-start">
                    <label class="form-label">아이디</label>
                    <input type="text" class="form-control" id="usernameInput" name="username" placeholder="아이디입력" required>
                    <div class="invalid-feedback" id="usernameMsg"></div>
                </div>
                
                <div class="mb-3 text-start">
                    <label class="form-label">패스워드</label>
                    <input type="password" class="form-control" id="passwordInput" placeholder="패스워드입력" required>
                    <div class="invalid-feedback" id="passwordMsg"></div>
                    
                    <input type="hidden" id="password" name="password">
                </div>
                
                <button type="button" class="btn btn-primary w-100" onclick="validateAndLogin()">로그인</button>
                
                <hr>
                <a href="/register" class="btn btn-outline-secondary w-100">
                    회원가입
                </a>
            </form>
        </div>
    </section>

    <script src="../js/search.js"></script>
    
    <script src="../js/login.js"></script>
    
</body>
</html>
