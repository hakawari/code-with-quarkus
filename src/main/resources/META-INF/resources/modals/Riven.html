<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아트록스 상세</title>
  
  <!-- Bootstrap 5 CSS (index.html과 동일하게 연동) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  
  <!-- LOL 스타일 맞추기 위한 간단 커스텀 (필요 시 resources/css/custom.css로 이동) -->
  <style>
    body {
      background-color: #0a0e17;
      color: white;
      padding: 1.5rem;
      font-family: 'Segoe UI', sans-serif;
    }
    h3, h4 {
      color: #c8aa6e; /* LOL 골드 톤 */
    }
    .text-muted {
      color: #a0a0a0 !important;
    }
    .list-group-item {
      background: transparent;
      border-color: #444;
      color: white;
    }
  </style>
</head>
<body>

  <div class="container-fluid">
    <div class="row g-4">
      
      <!-- 왼쪽: 이미지 + 기본 정보 -->
      <div class="col-lg-5 text-center">
        <img src="../image/Riven.webp" class="img-fluid rounded shadow-lg" alt="리븐" style="max-height: 480px; object-fit: contain;">
        <div class="mt-3">
          <h3 class="mb-1">리븐 (Riven)</h3>
          <p class="text-muted fs-5">전사 / 소속 녹서스</p>
        </div>
      </div>
      
      <!-- 오른쪽: 스킬 + 스토리 -->
      <div class="col-lg-7">
        <h4 class="border-bottom border-secondary pb-2 mb-3">스킬</h4>
        <ul class="list-group list-group-flush mb-4">
          <li class="list-group-item">패시브: 룬검</li>
          <li class="list-group-item">Q: 부러진 날개</li>
          <li class="list-group-item">W: 기 폭발</li>
          <li class="list-group-item">E: 용맹</li>
          <li class="list-group-item">R: 추방자의 검 / 바람 가르기</li>
        </ul>

        <h4 class="border-bottom border-secondary pb-2 mb-3">배경 스토리 요약</h4>
        <p class="text-secondary lh-lg">
            "검은 주인을 고스란히 비추는 법. 나의 검은 칠흑같이 검고 부러져있다."
        </p>
      </div>
      
    </div>
  </div>

</body>
</html>
